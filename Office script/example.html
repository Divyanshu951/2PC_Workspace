<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rename Buttons</title>
    <style>
        .button-container {
            display: flex;
            gap: 10px;
        }
        .button-container button {
            padding: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="button-container-email">
        <button id="button1">Button 1</button>
        <button id="button2">Button 2</button>
        <button id="button3">Button 3</button>
        <button id="button4">Button 4</button>
        <button id="button5">Button 5</button>
    </div>

    <script>
        const buttons = document.querySelectorAll('.button-container-email button');

        buttons.forEach((button, index) => {
            let isRenamed = false; // Track if the button has been renamed
            button.addEventListener('click', () => {
                if (!isRenamed) {
                    const newName = prompt(`Enter new name for Button ${index + 1}:`);
                    if (newName) {
                        button.textContent = newName;
                    }
                    isRenamed = true; // Mark the button as renamed
                }
            });
        });
    </script>
</body>
</html>
